name: Software tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-required:
    name: Required native software tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tested SHA and assert clean tree
        run: |
          git rev-parse HEAD
          test -z "$(git status --porcelain)" || { echo 'Dirty tree; refusing to test' >&2; git status --short >&2; exit 1; }
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/b1b875982b17dabde9b4a37f3e229e74913e6db3.tar.gz
      - name: Runner fixtures
        run: |
          bash tests/fixtures/runner_summary/run_check.sh
          bash tests/fixtures/native_lane/run_check.sh
          python3 tests/fixtures/verify_cleanup/check.py
          python3 tests/fixtures/install/test_install.py -v
      - name: Build and run software suite, native harness required
        env:
          GOODIX_NATIVE_TESTS: required
          GOODIX_SUSPEND_TESTS: required
        run: bash tests/run_all_tests.sh
      - name: Build downstream fprintd against the driver
        run: >-
          nix-build --no-out-link -E
          'let pkgs = import <nixpkgs> {}; in pkgs.fprintd.override {
          libfprint = pkgs.callPackage ./libfprint-goodix.nix {}; }'
